<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nurol Envanter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Yerleşim: lacivert sabit yan menü + açık zeminli çalışma alanı; kartlar yalnızca gruplama gereken yerde. */
:root {
  --bg: #f2f5f9; --surface: #ffffff; --surface-2: #f7f9fc; --line: #dbe2ec;
  --fg: #142235; --muted: #5a6a80; --accent: #1f5fd1; --accent-soft: #e6eefc;
  --nav: #0f2744; --nav-fg: #c9d6e8; --nav-active: #1c3c66;
  --ok: #1d7f55; --ok-soft: #e3f4ec; --warn: #a76b12; --warn-soft: #fbf0dc;
  --crit: #b83a28; --crit-soft: #fbe7e3; --move: #5b46c9; --move-soft: #ece9fb;
  --font-display: "Manrope", "Segoe UI", system-ui, sans-serif;
  --font-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 10px; color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c141f; --surface: #131e2d; --surface-2: #182536; --line: #24344b;
  --fg: #e3e9f2; --muted: #8fa0b7; --accent: #6c9cf3; --accent-soft: #1a2c4a;
  --nav: #08101a; --nav-fg: #a9b8cc; --nav-active: #18294160;
  --ok: #4cc28c; --ok-soft: #12302a; --warn: #e0a64a; --warn-soft: #33270f;
  --crit: #ef7a66; --crit-soft: #3a1a16; --move: #a594f5; --move-soft: #261f47; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0c141f; --surface: #131e2d; --surface-2: #182536; --line: #24344b;
  --fg: #e3e9f2; --muted: #8fa0b7; --accent: #6c9cf3; --accent-soft: #1a2c4a;
  --nav: #08101a; --nav-fg: #a9b8cc; --nav-active: #18294160;
  --ok: #4cc28c; --ok-soft: #12302a; --warn: #e0a64a; --warn-soft: #33270f;
  --crit: #ef7a66; --crit-soft: #3a1a16; --move: #a594f5; --move-soft: #261f47; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-body); }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 22px; font-weight: 800; }
h2 { font-size: 16px; font-weight: 700; }
h3 { font-size: 13px; font-weight: 700; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-size: 12.5px; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: 236px 1fr; min-height: 100%; }
.side { background: var(--nav); color: var(--nav-fg); padding: 18px 12px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px; color: #fff; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(140deg, #3b7cf0, #1a4aa8); display: grid; place-items: center; font: 800 13px var(--font-display); color: #fff; }
.brand b { font: 800 15px var(--font-display); display: block; line-height: 1.1; }
.brand small { font-size: 11px; color: var(--nav-fg); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--nav-fg); text-decoration: none; font-weight: 500; }
.nav a:hover { background: #ffffff10; color: #fff; }
.nav a.on { background: var(--nav-active); color: #fff; box-shadow: inset 3px 0 0 #5b93f5; }
.nav svg { width: 17px; height: 17px; flex: none; opacity: .85; }
.nav .sep { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; padding: 14px 10px 4px; color: #7f93ad; }
.side-foot { margin-top: auto; font-size: 11.5px; padding: 10px; border-radius: 8px; background: #ffffff0c; line-height: 1.45; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 12px; padding: 12px max(24px, env(safe-area-inset-right, 0px)) 12px max(24px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 5; }
.search { flex: 1; max-width: 460px; display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
.search input { border: 0; background: none; outline: none; width: 100%; }
.top .sp { flex: 1; }
.chip-select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; }
.user { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 12px; }
.proto { font-size: 11px; font-weight: 600; color: var(--warn); background: var(--warn-soft); padding: 3px 8px; border-radius: 99px; white-space: nowrap; }

.view { padding: 22px max(24px, env(safe-area-inset-right, 0px)) 40px max(24px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; }
.head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.head .t { flex: 1; min-width: 220px; }
.head p { margin: 4px 0 0; color: var(--muted); }
.crumb { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.crumb a { color: var(--accent); text-decoration: none; }

.btn { text-decoration: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.pri:hover { filter: brightness(1.08); }
.btn.sm { padding: 4px 9px; font-size: 12px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.card > .ch { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.card > .ch h2 { flex: 1; }
.card > .cb { padding: 14px 16px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
.g2e { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: inherit; }
.kpi:hover { border-color: var(--accent); }
.kpi .l { font-size: 12px; color: var(--muted); }
.kpi .v { font: 800 26px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 11.5px; color: var(--muted); }
.kpi.alert .v { color: var(--crit); }
.kpi.alert { border-color: color-mix(in srgb, var(--crit) 35%, var(--line)); }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.p-depoda { color: var(--ok); background: var(--ok-soft); }
.p-zimmetli { color: var(--accent); background: var(--accent-soft); }
.p-transferde { color: var(--move); background: var(--move-soft); }
.p-bakimda { color: var(--warn); background: var(--warn-soft); }
.p-disi { color: var(--muted); background: var(--surface-2); }
.p-crit { color: var(--crit); background: var(--crit-soft); }
.tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); }
.tag.ad { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); background: var(--accent-soft); }
.tag.custom { color: var(--move); border-color: color-mix(in srgb, var(--move) 30%, var(--line)); background: var(--move-soft); }

.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
tr.sel td { background: var(--accent-soft); }
td .sub { display: block; font-size: 12px; color: var(--muted); }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.toolbar .search { max-width: 280px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 11px; cursor: pointer; font-size: 12.5px; font-weight: 500; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.views { display: flex; gap: 4px; padding: 0 16px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.views button { border: 0; background: none; padding: 11px 10px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.views button.on { color: var(--fg); border-bottom-color: var(--accent); }
.pop-wrap { position: relative; }
.pop { position: absolute; right: 0; top: calc(100% + 6px); width: 260px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 12px 32px #0f274426; padding: 10px; z-index: 10; }
.pop h3 { padding: 2px 4px 8px; }
.pop label { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-radius: 6px; cursor: grab; }
.pop label:hover { background: var(--surface-2); }
.pop .grip { color: var(--muted); font-size: 11px; margin-left: auto; letter-spacing: -2px; }
.pop .foot { display: flex; gap: 6px; padding-top: 8px; border-top: 1px solid var(--line); margin-top: 6px; }

.bars { display: flex; flex-direction: column; gap: 12px; }
.bar-row { display: grid; grid-template-columns: 150px 1fr 48px; gap: 10px; align-items: center; font-size: 13px; }
.bar { height: 10px; border-radius: 99px; background: var(--surface-2); display: flex; overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; background: var(--c); vertical-align: -1px; }

.feed { display: flex; flex-direction: column; }
.feed li { list-style: none; display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
.feed li:last-child { border-bottom: 0; }
.feed ul { margin: 0; padding: 0; }
.ico { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; font-size: 12px; font-family: var(--font-display); }
.time { font-size: 12px; color: var(--muted); white-space: nowrap; }

.kv { display: grid; grid-template-columns: 150px 1fr; gap: 8px 14px; font-size: 13.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.group-title { display: flex; align-items: center; gap: 8px; margin: 16px 0 10px; font: 700 12px var(--font-display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.group-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.timeline { list-style: none; margin: 0; padding: 0 0 0 4px; }
.timeline li { position: relative; padding: 0 0 16px 22px; border-left: 2px solid var(--line); }
.timeline li:last-child { border-left-color: transparent; padding-bottom: 0; }
.timeline li::before { content: ""; position: absolute; left: -7px; top: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--c, var(--accent)); }
.timeline b { display: block; font-weight: 600; }

.doc-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.doc-row:last-child { border-bottom: 0; }
.doc-ic { width: 32px; height: 38px; border-radius: 5px; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; font: 700 9px var(--font-mono); color: var(--crit); flex: none; }
.doc-row .grow { flex: 1; min-width: 0; }

.steps { display: flex; align-items: center; gap: 0; font-size: 12px; }
.steps span { display: flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; }
.steps span::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); }
.steps span.done { color: var(--fg); }
.steps span.done::before { background: var(--ok); border-color: var(--ok); }
.steps span.now { color: var(--move); font-weight: 700; }
.steps span.now::before { background: var(--move); border-color: var(--move); box-shadow: 0 0 0 3px var(--move-soft); }
.steps i { width: 26px; height: 2px; background: var(--line); margin: 0 6px; }

.field-list { display: flex; flex-direction: column; }
.fl-row { display: grid; grid-template-columns: 22px minmax(0, 1.3fr) 110px minmax(0, 1.5fr) 92px; gap: 12px; align-items: center; padding: 11px 16px; border-bottom: 1px solid var(--line); }
.fl-row.h { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; background: var(--surface-2); padding-block: 8px; }
.fl-row.arch { opacity: .6; }
.fl-row .grip { color: var(--muted); cursor: grab; letter-spacing: -2px; }
.rules { display: flex; gap: 5px; flex-wrap: wrap; }
.cat-list { display: flex; flex-direction: column; padding: 6px; }
.cat-list button { display: flex; justify-content: space-between; align-items: center; border: 0; background: none; text-align: left; padding: 9px 10px; border-radius: 8px; cursor: pointer; }
.cat-list button:hover { background: var(--surface-2); }
.cat-list button.on { background: var(--accent-soft); color: var(--accent); font-weight: 700; }

.a4-wrap { background: var(--surface-2); border-radius: var(--r); padding: 18px; overflow-x: auto; }
.a4 { width: 100%; max-width: 560px; min-width: 480px; margin: 0 auto; aspect-ratio: 210 / 297; background: #fff; color: #18202b; box-shadow: 0 6px 24px #0f274422; padding: 36px 40px; font-size: 10.5px; line-height: 1.45; display: flex; flex-direction: column; gap: 14px; }
.a4 .dh { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #1f3d66; padding-bottom: 10px; }
.a4 .dh b { font: 800 15px var(--font-display); color: #1f3d66; display: block; }
.a4 table th { background: #eef2f8; color: #3b4a5e; font-size: 8.5px; padding: 5px 6px; border: 1px solid #cdd6e3; }
.a4 table td { padding: 5px 6px; border: 1px solid #cdd6e3; font-size: 9.5px; }
.a4 .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 20px; }
.a4 .meta span { color: #5b6879; }
.a4 .sig { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
.a4 .sig div { border-top: 1px solid #18202b; padding-top: 5px; text-align: center; }
.a4 .stmt { color: #333d4a; }
.a4 .ft { display: flex; justify-content: space-between; color: #7a8696; font-size: 8.5px; border-top: 1px solid #dde3ec; padding-top: 6px; }

.drop { border: 2px dashed var(--line); border-radius: var(--r); padding: 18px; text-align: center; color: var(--muted); display: block; cursor: pointer; }
.drop:hover { border-color: var(--accent); color: var(--accent); }
.drop input { display: none; }

.form { display: grid; gap: 12px; }
.form label { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; }
.form input, .form select { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); font-weight: 400; font-size: 14px; }
.form .err input { border-color: var(--crit); }
.err-msg { color: var(--crit); font-size: 12.5px; font-weight: 500; }
.note { font-size: 12.5px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); }
.note.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 30%, var(--line)); color: var(--fg); }

.tree { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.wh { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.wh ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.wh li { display: flex; justify-content: space-between; padding: 5px 8px; border-radius: 6px; background: var(--surface-2); }
.stat-line { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.stat-line b { color: var(--fg); font-variant-numeric: tabular-nums; }

.stock-meter { width: 120px; height: 6px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.stock-meter i { display: block; height: 100%; }

.login { min-height: 100%; display: grid; grid-template-columns: 1.1fr 1fr; }
.login-art { background: var(--nav); color: #fff; padding: 48px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
.login-art h1 { font-size: 34px; line-height: 1.15; max-width: 14ch; color: #fff; }
.login-art p { color: var(--nav-fg); max-width: 42ch; }
.login-grid { position: absolute; inset: auto -40px -40px auto; width: 360px; height: 360px; background-image: linear-gradient(#ffffff12 1px, transparent 1px), linear-gradient(90deg, #ffffff12 1px, transparent 1px); background-size: 28px 28px; transform: rotate(-8deg); }
.login-form { display: grid; place-items: center; padding: 32px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px)); }
.login-box { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 18px; }
.login-box .seg { width: 100%; }
.login-box .seg button { flex: 1; padding: 9px; }

.toast { position: fixed; right: max(20px, env(safe-area-inset-right, 0px)); bottom: max(20px, env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; z-index: 50; }

@media (max-width: 1180px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } .tree { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; align-items: center; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); gap: 12px; overflow-x: auto; }
  .brand small, .side-foot, .nav .sep { display: none; }
  .nav { flex-direction: row; }
  .nav a { white-space: nowrap; }
  .nav a.on { box-shadow: inset 0 -3px 0 #5b93f5; }
  .g2, .g2e, .login { grid-template-columns: 1fr; }
  .login-art { padding: 28px 20px; }
  .fl-row { grid-template-columns: 18px minmax(0, 1fr) 90px; }
  .fl-row > :nth-child(4), .fl-row > :nth-child(5) { display: none; }
}
@media (max-width: 640px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tree { grid-template-columns: 1fr; }
  .top { flex-wrap: wrap; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
  .view { padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
  .user span, .top .chip-select { display: none; }
  .kv { grid-template-columns: 1fr; gap: 2px; }
  .kv dd { margin-bottom: 8px; }
  .bar-row { grid-template-columns: 100px 1fr 40px; }
}
@media (prefers-reduced-motion: no-preference) { .view { animation: fade .18s ease-out; } @keyframes fade { from { opacity: .4; transform: translateY(3px); } } }
</style>
</head>
<body>
<div id="root"></div>
<script>
const ICONS = {
  genel: '<path d="M3 13h8V3H3zm10 8h8V11h-8zM3 21h8v-6H3zm10-18v6h8V3z"/>',
  envanter: '<path d="M4 7l8-4 8 4v10l-8 4-8-4z"/><path d="M4 7l8 4 8-4M12 11v10"/>',

V.giris = () => `<div class="login">
  <div class="login-art"><div class="brand"><div class="brand-mark">NE</div><div><b>Nurol Envanter</b><small>Demirbaş · Stok · Zimmet</small></div></div>
    <div><h1>Depodan personele, her cihazın kaydı tek yerde.</h1><p>Zimmet tutanağını üretin, imzalı kopyayı yükleyin, transferleri teslim alınana kadar izleyin.</p></div>
    <div class="login-grid"></div><span style="font-size:12px;color:var(--nav-fg)">Prototip · <a href="#genel" style="color:#8fb4f5">uygulamaya dön</a></span></div>
  <div class="login-form"><form class="login-box form" id="loginForm">
    <div><h1>Giriş yap</h1><p class="muted" style="margin:4px 0 0">Hesap türünüzü seçin.</p></div>
    <div class="seg"><button type="button" data-lt="ad" class="${state.loginType === 'ad' ? 'on' : ''}">Kurum hesabı (AD)</button><button type="button" data-lt="local" class="${state.loginType === 'local' ? 'on' : ''}">Yerel hesap</button></div>
    <label>${state.loginType === 'ad' ? 'Kurum kullanıcı adı' : 'Kullanıcı adı'}<input id="lu" placeholder="${state.loginType === 'ad' ? 'ad.soyad' : 'yerel kullanıcı adı'}" autocomplete="username"></label>
    <label>Parola<input id="lp" type="password" autocomplete="current-password"></label>
    <p class="note">${state.loginType === 'ad' ? 'Windows parolanızla giriş yaparsınız. Uygulamaya erişim yöneticinin yetki vermesiyle açılır.' : 'Yerel hesaplar yönetici tarafından oluşturulur. Parolanızı unuttuysanız yöneticinize başvurun.'}</p>
    <button class="btn pri" type="submit" style="justify-content:center;padding:10px">Giriş yap</button>
  </form></div></div>`;

function render() {
  let r = location.hash.slice(1);
  if (!V[r]) r = 'genel';
  $('#root').innerHTML = r === 'giris' ? V.giris() : shell(r, V[r]());
  window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-st],[data-view],[data-col],[data-tag],[data-z],[data-fcat],[data-lt],#colBtn,#colClose,#colSave,#saveView,#newAsset');
  if (!t) return;
  if (t.dataset.st) { state.st = t.dataset.st; render(); }
  else if (t.dataset.view) { state.view = t.dataset.view; render(); }
  else if (t.dataset.col) { COLS[+t.dataset.col].on = t.checked; $('#atable').innerHTML = tableHTML(); $('#colBtn').textContent = 'Sütunlar · ' + COLS.filter(c => c.on).length; return; }
  else if (t.dataset.tag) { state.sel = t.dataset.tag; location.hash = 'varlik'; }
  else if (t.dataset.z) { state.zsel = t.dataset.z; render(); }
  else if (t.dataset.fcat) { state.fcat = t.dataset.fcat; render(); }
  else if (t.dataset.lt) { state.loginType = t.dataset.lt; render(); }
  else if (t.id === 'colBtn') { state.colsOpen = !state.colsOpen; render(); }
  else if (t.id === 'colClose') { state.colsOpen = false; render(); }
  else if (t.id === 'colSave') { state.colsOpen = false; render(); toast(`"${state.view}" görünümünün sütunları kaydedildi`); }
  else if (t.id === 'saveView') toast('Görünüm kaydetme: ad verip filtre ve sütunlarla birlikte saklanır');
  else if (t.id === 'newAsset') toast('Envanter ekleme formu kategoriye göre özel alanları gösterir');
});
document.addEventListener('input', e => {
  if (e.target.id === 'aq') { state.q = e.target.value; $('#atable').innerHTML = tableHTML(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'acat') { state.cat = e.target.value; render(); }
  if (e.target.id === 'upl' && e.target.files[0]) {
    const f = e.target.files[0];
    if (f.size > 20 * 1024 * 1024) return toast('Dosya 20 MB sınırını aşıyor. Daha düşük çözünürlükte tarayın.');
    if (!/\.(pdf|jpe?g|png)$/i.test(f.name)) return toast('Yalnızca PDF, JPEG veya PNG yüklenebilir.');
    state.uploaded[state.zsel] = f.name; render(); toast('İmzalı kopya yüklendi (prototip: dosya hiçbir yere gönderilmez)');
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'loginForm') location.hash = 'genel';
  if (e.target.id === 'sarf') toast('Kaydedilmedi: miktar depodaki bakiyeyi aşıyor');
});
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
