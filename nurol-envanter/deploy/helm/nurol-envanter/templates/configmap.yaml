apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ne.fullname" . }}-ayarlar
  labels: {{- include "ne.labels" . | nindent 4 }}
  annotations:
    # Migration Job'u (pre-install hook) bu ayarlara kurulumdan önce ihtiyaç duyar.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  ASPNETCORE_ENVIRONMENT: {{ .Values.config.environment | quote }}
  ASPNETCORE_HTTP_PORTS: "8080"
  Bootstrap__AdminUserName: {{ .Values.config.bootstrapAdminUserName | quote }}
  Security__SecureCookies: {{ .Values.config.secureCookies | quote }}
  Security__LoginAttemptsPerMinute: {{ .Values.config.loginAttemptsPerMinute | quote }}
  Database__MigrateOnStartup: "false"
  Storage__Provider: {{ .Values.config.storage.provider | quote }}
  Storage__ServiceUrl: {{ .Values.config.storage.serviceUrl | quote }}
  Storage__Bucket: {{ .Values.config.storage.bucket | quote }}
  Storage__Region: {{ .Values.config.storage.region | quote }}
  Storage__ForcePathStyle: {{ .Values.config.storage.forcePathStyle | quote }}
  {{- with .Values.directory }}
  Directory__Enabled: {{ .syncEnabled | quote }}
  Directory__LoginEnabled: {{ .loginEnabled | quote }}
  Directory__Server: {{ .server | quote }}
  Directory__Port: {{ .port | quote }}
  Directory__UseSsl: {{ .useSsl | quote }}
  Directory__BaseDn: {{ .baseDn | quote }}
  Directory__Filter: {{ .filter | quote }}
  Directory__BindDn: {{ .bindDn | quote }}
  Directory__Domain: {{ .domain | quote }}
  Directory__IdAttribute: {{ .attributes.id | quote }}
  Directory__IdIsBinaryGuid: {{ .attributes.idIsBinaryGuid | quote }}
  Directory__UserNameAttribute: {{ .attributes.userName | quote }}
  Directory__DisplayNameAttribute: {{ .attributes.displayName | quote }}
  Directory__EmailAttribute: {{ .attributes.email | quote }}
  Directory__TitleAttribute: {{ .attributes.title | quote }}
  Directory__DepartmentAttribute: {{ .attributes.department | quote }}
  Directory__CompanyAttribute: {{ .attributes.company | quote }}
  Directory__EmployeeNumberAttribute: {{ .attributes.employeeNumber | quote }}
  Directory__DisabledMode: {{ .disabledMode | quote }}
  Directory__MinFoundRatio: {{ .minFoundRatio | quote }}
  Directory__ScheduleNote: {{ if .schedule.enabled }}{{ .schedule.note | quote }}{{ else }}""{{ end }}
  {{- end }}
  {{- range $k, $v := .Values.config.extraEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
