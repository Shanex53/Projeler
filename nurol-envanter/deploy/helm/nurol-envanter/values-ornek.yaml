# Örnek kurum değerleri. Kopyalayıp kendi ortamınıza göre düzenleyin:
#   helm upgrade --install nurol-envanter deploy/helm/nurol-envanter -n envanter -f values-kurum.yaml
image:
  repository: registry.kurum.local/nurol/nurol-envanter
  tag: "1.0.0"

replicaCount: 2
existingSecret: nurol-envanter-gizli

config:
  bootstrapAdminUserName: yonetici
  storage:
    provider: S3
    serviceUrl: https://minio.kurum.local
    bucket: nurol-envanter

corporateCa:
  enabled: true
  configMap: kurum-ca
  key: ca.crt

ingress:
  enabled: true
  className: nginx
  host: envanter.kurum.local
  tls:
    enabled: true
    secretName: envanter-kurum-tls

directory:
  syncEnabled: true
  loginEnabled: true
  server: dc01.nurol.local
  baseDn: OU=Personel,DC=nurol,DC=local
  bindDn: CN=svc-envanter,OU=Servis Hesaplari,DC=nurol,DC=local
  domain: nurol.local
  schedule:
    enabled: true
    cron: "0 2 * * *"
    note: "Her gece 02:00"

smtp:
  enabled: true
  host: smtp.kurum.local
  port: 587
  userName: envanter-bildirim
  from: envanter@nurol.com.tr
  digest:
    enabled: true
    cron: "30 7 * * 1-5"

printers:
  pollMinutes: 5
  allowedNetworks:
    - 10.20.0.0/16   # yazıcı VLAN'ı
